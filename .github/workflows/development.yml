name: Development deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      preview_pr:
        description: 'PR number for a preview; leave empty to deploy develop integration'
        required: false
        type: string
      reviewed_sha:
        description: 'Full reviewed commit SHA for a preview'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: elora-development-services
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.BILLING_APPROVED == 'true' && vars.CLOUD_SERVICES_READY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Resolve reviewed internal preview or integration commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.preview_pr }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          COMPLETED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh pr view "$PR" --json isCrossRepository,state,headRefOid > /tmp/elora-pr.json
            python -c 'import json; p=json.load(open("/tmp/elora-pr.json")); assert not p["isCrossRepository"] and p["state"]=="OPEN"'
            head_sha="$(python -c 'import json; print(json.load(open("/tmp/elora-pr.json"))["headRefOid"])')"
            [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ && "$REVIEWED_SHA" = "$head_sha" ]] || exit 1
            echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "schema=pr_$PR" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$COMPLETED_SHA" ]; then
              [ "$(git rev-parse HEAD)" = "$COMPLETED_SHA" ] || exit 1
            fi
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "schema=integration" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pytest
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy after reviewed environment approval
        env:
          BILLING_APPROVED: ${{ vars.BILLING_APPROVED }}
          CLOUD_SERVICES_READY: ${{ vars.CLOUD_SERVICES_READY }}
          CLOUD_PROJECT_ID: ${{ vars.CLOUD_PROJECT_ID }}
          CLOUD_REGION: ${{ vars.CLOUD_REGION }}
          ASSET_BUCKET: ${{ vars.ASSET_BUCKET }}
          DATABASE_ADMIN_URL: ${{ secrets.DEV_DATABASE_ADMIN_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SCHEMA: ${{ steps.target.outputs.schema }}
          SHA: ${{ steps.target.outputs.sha }}
        run: python infra/deploy.py "$SCHEMA" "$SHA"
