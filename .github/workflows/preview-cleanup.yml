name: Retire development previews

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: elora-development-services
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      vars.BILLING_APPROVED == 'true' &&
      vars.CLOUD_SERVICES_READY == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - env:
          BILLING_APPROVED: ${{ vars.BILLING_APPROVED }}
          CLOUD_SERVICES_READY: ${{ vars.CLOUD_SERVICES_READY }}
          CLOUD_PROJECT_ID: ${{ vars.CLOUD_PROJECT_ID }}
          CLOUD_REGION: ${{ vars.CLOUD_REGION }}
          ASSET_BUCKET: ${{ vars.ASSET_BUCKET }}
          DATABASE_ADMIN_URL: ${{ secrets.DEV_DATABASE_ADMIN_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          GH_TOKEN: ${{ github.token }}
        run: python infra/cleanup.py
